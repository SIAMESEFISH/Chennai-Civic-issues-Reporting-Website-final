<!DOCTYPE html>
<html>
<head>
    <title>Report Issue</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<header class="navbar">
    <div class="logo">🌿 <strong>Chennai Civic-Issues Reporting System</strong></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="user-login.html">Dashboard</a>
        <button id="themeToggle" class="theme-btn">🌙</button>

    </nav>
</header>

<div class="card">
    <h2>📣 Report an Issue</h2>

    <div id="complaintSuccessCard" style="display:none; margin-bottom: 15px; padding: 14px; border-radius: 10px; background: #ecfdf5; border-left: 4px solid #16a34a;">
        <div style="font-weight: 700; color: #166534; margin-bottom: 6px;">Complaint submitted successfully</div>
        <div style="color: #14532d; margin-bottom: 10px;">
            Your Complaint ID:
            <span id="complaintIdValue" style="font-weight: 700;"></span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" class="btn" style="background: #16a34a; color: white;" onclick="copyLatestComplaintId()">Copy Complaint ID</button>
            <button type="button" class="btn" style="background: #2563eb; color: white;" onclick="window.location.href='dashboard.html#my-complaints'">Go to My Complaints</button>
        </div>
    </div>

    <!-- SINGLE FORM -->
    <form onsubmit="submitComplaint(event)">

        <input type="text" id="name" placeholder="Your Name" required>

        <select id="category" required onchange="toggleOtherCategory()">
            <option value="">Select Category</option>
            <option value="Road">Road Damage</option>
            <option value="Garbage">Garbage Issue</option>
            <option value="Street Light">Street Light Failure</option>
            <option value="Other">Other (Please Specify)</option>
        </select>
        <input type="text" id="otherCategoryInput" placeholder="Enter custom category" style="display:none; margin-top: 10px;">

        <!-- Ward Number Field -->
        <input type="text" id="wardNumber" placeholder="Enter Ward Number (e.g., Ward 1, Ward 2, Ward 3)" style="margin-top: 10px;">

        <!-- <input type="text" id="location" placeholder="Area / Landmark" required> -->
        <div class="form-group" style="margin-top: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Pinpoint Location</label>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <input type="text" id="mapSearch" placeholder="Search for your area (e.g. Kothrud, Pune)" style="flex-grow: 1; padding: 8px;">
                <button type="button" onclick="searchArea()" class="btn" style="padding: 5px 15px; background: #3498db; color: white; border: none; cursor: pointer;">🔍 Search</button>
            </div>
            
            <button type="button" onclick="getUserLocation()" class="btn" style="margin-bottom: 10px; background: #eee; color: #333; font-size: 0.8em;">
                📍 Use My Current Location
            </button>

            <div id="map" style="height: 250px; width: 100%; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ccc; z-index: 1;"></div>

            <input type="text" id="location" placeholder="Enter detailed address or landmark" required>
            
            <input type="hidden" id="latitude">
            <input type="hidden" id="longitude">
        </div>
        <textarea id="description" placeholder="Describe the issue" required></textarea>

        <input type="file" id="image">

        <button type="submit" class="btn btn-primary" style="width:100%">
            Submit Complaint
        </button>

    </form>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/main.js"></script>
<script src="js/admin_map.js"></script>
<script>
    // Pre-fill Ward Number from logged-in user's profile
    window.addEventListener('DOMContentLoaded', () => {
        const userWardNumber = localStorage.getItem("userWardNumber");
        const wardNumberInput = document.getElementById("wardNumber");
        
        if (userWardNumber && wardNumberInput) {
            wardNumberInput.value = userWardNumber;
        }
    });
</script>
</body>
</html>

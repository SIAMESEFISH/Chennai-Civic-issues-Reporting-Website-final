<!DOCTYPE html>
<html>
<head>
    <title>Worker Management - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .worker-management {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-header h2 {
            color: #16a34a;
            font-size: 28px;
            margin: 0;
        }

        body.dark .section-header h2 {
            color: var(--neon-blue);
        }

        .btn-add-worker {
            background: #16a34a;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s;
        }

        .btn-add-worker:hover {
            background: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }

        .workers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .worker-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        body.dark .worker-card {
            background: var(--card-dark);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
        }

        .worker-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .worker-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .worker-icon {
            font-size: 40px;
        }

        .worker-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        body.dark .status-active {
            background: #064e3b;
            color: #a7f3d0;
        }

        body.dark .status-inactive {
            background: #7f1d1d;
            color: #fecaca;
        }

        .worker-name {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 5px 0;
        }

        body.dark .worker-name {
            color: #e6e6e6;
        }

        .worker-id {
            font-size: 13px;
            color: #6b7280;
            margin: 0 0 15px 0;
        }

        .worker-info {
            margin: 15px 0;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        body.dark .info-row {
            border-bottom-color: #374151;
        }

        .info-label {
            color: #6b7280;
            font-weight: 600;
        }

        .info-value {
            color: #1f2937;
        }

        body.dark .info-value {
            color: #d1d5db;
        }

        .worker-stats {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }

        .stat-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f9fafb;
            border-radius: 8px;
        }

        body.dark .stat-item {
            background: #1f2937;
        }

        .stat-num {
            font-size: 24px;
            font-weight: 700;
            color: #16a34a;
            display: block;
        }

        body.dark .stat-num {
            color: var(--neon-blue);
        }

        .stat-label {
            font-size: 11px;
            color: #6b7280;
        }

        .worker-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-toggle {
            background: #3b82f6;
            color: white;
        }

        .btn-toggle:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        body.dark .modal-content {
            background: var(--card-dark);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h3 {
            color: #16a34a;
            font-size: 24px;
            margin: 0;
        }

        body.dark .modal-header h3 {
            color: var(--neon-blue);
        }

        .close-modal {
            font-size: 30px;
            font-weight: bold;
            color: #6b7280;
            cursor: pointer;
            line-height: 1;
        }

        .close-modal:hover {
            color: #dc2626;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        body.dark .form-group label {
            color: #e6e6e6;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        body.dark .form-group input,
        body.dark .form-group select {
            background: #1f2937;
            border-color: #374151;
            color: #e6e6e6;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: #15803d;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo">🌿 <strong>Chennai Civic-Issues Reporting System</strong></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="admin.html">Dashboard</a>
        <a href="ward-heatmap.html">Ward Heatmap</a>
        <a href="admin-workers.html">Workers</a>
        <span id="adminWelcome" style="color: #16a34a; font-weight: 500;"></span>
        <button onclick="handleLogout()" style="background: #dc2626; color: white; padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; margin-left: 10px;">
            Logout
        </button>
        <button id="themeToggle" class="theme-btn">🌙</button>
    </nav>
</header>

<div class="worker-management">
    <div class="section-header">
        <h2>👷 Worker Management</h2>
        <button class="btn-add-worker" onclick="openAddWorkerModal()">
            ➕ Add New Worker
        </button>
    </div>

    <div id="workersGrid" class="workers-grid">
        <!-- Workers will be loaded here -->
    </div>
</div>

<!-- Add Worker Modal -->
<div id="addWorkerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Register New Worker</h3>
            <span class="close-modal" onclick="closeAddWorkerModal()">&times;</span>
        </div>

        <form id="addWorkerForm" onsubmit="registerWorker(event)">
            <div class="form-group">
                <label for="workerName">Full Name *</label>
                <input type="text" id="workerName" required placeholder="Enter worker's full name">
            </div>

            <div class="form-group">
                <label for="workerEmail">Email Address *</label>
                <input type="email" id="workerEmail" required placeholder="worker@example.com">
            </div>

            <div class="form-group">
                <label for="workerPassword">Password *</label>
                <input type="password" id="workerPassword" required placeholder="Create a password">
            </div>

            <div class="form-group">
                <label for="workerPhone">Phone Number *</label>
                <input type="tel" id="workerPhone" required placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label for="workerWard">Assigned Ward Number *</label>
                <input type="text" id="workerWard" required placeholder="e.g., Ward 1, Ward 2, Ward 3">
            </div>

            <div class="form-group">
                <label for="workerSpecialization">Specialization</label>
                <select id="workerSpecialization">
                    <option value="General">General Maintenance</option>
                    <option value="Road Damage">Road Damage</option>
                    <option value="Garbage">Garbage Collection</option>
                    <option value="Street Light">Street Light</option>
                    <option value="Water Supply">Water Supply</option>
                    <option value="Drainage">Drainage</option>
                    <option value="Park">Park Maintenance</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Register Worker</button>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    // Authentication Check
    (function checkAuth() {
        const isLoggedIn = localStorage.getItem("adminLoggedIn");
        const adminUsername = localStorage.getItem("adminUsername");

        if (isLoggedIn !== "true") {
            window.location.href = "admin-login.html";
            return;
        }

        const welcomeSpan = document.getElementById("adminWelcome");
        if (welcomeSpan && adminUsername) {
            welcomeSpan.textContent = `Welcome, ${adminUsername}`;
        }
    })();

    function handleLogout() {
        if (confirm("Are you sure you want to logout?")) {
            localStorage.removeItem("adminLoggedIn");
            localStorage.removeItem("adminUsername");
            localStorage.removeItem("adminId");
            window.location.href = "admin-login.html";
        }
    }

    // Load Workers
    async function loadWorkers() {
        try {
            const res = await fetch("http://localhost:5000/api/workers");
            const workers = await res.json();

            const grid = document.getElementById("workersGrid");

            if (workers.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">👷</div>
                        <h3>No Workers Registered</h3>
                        <p>Click "Add New Worker" to register your first field worker.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = workers.map(worker => `
                <div class="worker-card">
                    <div class="worker-header">
                        <div class="worker-icon">👷</div>
                        <span class="worker-status ${worker.isActive ? 'status-active' : 'status-inactive'}">
                            ${worker.isActive ? '✓ Active' : '✗ Inactive'}
                        </span>
                    </div>

                    <h3 class="worker-name">${worker.name}</h3>
                    <p class="worker-id">ID: ${worker.workerId}</p>

                    <div class="worker-info">
                        <div class="info-row">
                            <span class="info-label">📧 Email</span>
                            <span class="info-value">${worker.email}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">📱 Phone</span>
                            <span class="info-value">${worker.phone}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">📍 Ward Number</span>
                            <span class="info-value">${worker.assignedWard}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">🔧 Specialization</span>
                            <span class="info-value">${worker.specialization}</span>
                        </div>
                    </div>

                    <div class="worker-stats">
                        <div class="stat-item">
                            <span class="stat-num">${worker.tasksInProgress || 0}</span>
                            <span class="stat-label">In Progress</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-num">${worker.tasksCompleted || 0}</span>
                            <span class="stat-label">Completed</span>
                        </div>
                    </div>

                    <div class="worker-actions">
                        <button class="btn-action btn-toggle" onclick="toggleWorkerStatus('${worker.workerId}', ${!worker.isActive})">
                            ${worker.isActive ? 'Deactivate' : 'Activate'}
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteWorker('${worker.workerId}')">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error("Error loading workers:", err);
            alert("Failed to load workers");
        }
    }

    // Modal Functions
    function openAddWorkerModal() {
        document.getElementById("addWorkerModal").style.display = "block";
    }

    function closeAddWorkerModal() {
        document.getElementById("addWorkerModal").style.display = "none";
        document.getElementById("addWorkerForm").reset();
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
        const modal = document.getElementById("addWorkerModal");
        if (event.target === modal) {
            closeAddWorkerModal();
        }
    }

    // Register Worker
    async function registerWorker(e) {
        e.preventDefault();

        const workerData = {
            name: document.getElementById("workerName").value,
            email: document.getElementById("workerEmail").value,
            password: document.getElementById("workerPassword").value,
            phone: document.getElementById("workerPhone").value,
            assignedWard: document.getElementById("workerWard").value,
            specialization: document.getElementById("workerSpecialization").value
        };

        console.log("Submitting worker data:", workerData);

        try {
            const res = await fetch("http://localhost:5000/api/workers/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(workerData)
            });

            console.log("Response status:", res.status);
            console.log("Response headers:", res.headers);

            // Check if response is JSON
            const contentType = res.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const text = await res.text();
                console.error("Non-JSON response:", text);
                alert("Server error: Received non-JSON response. Check console for details.");
                return;
            }

            const data = await res.json();
            console.log("Response data:", data);

            if (!res.ok) {
                alert(data.message || "Registration failed");
                return;
            }

            alert(`✅ Worker registered successfully!\n\nWorker ID: ${data.workerId}\nEmail: ${workerData.email}\nPassword: ${workerData.password}\n\nPlease save these credentials.`);
            closeAddWorkerModal();
            loadWorkers();
        } catch (err) {
            console.error("Registration error:", err);
            alert("Registration failed: " + err.message);
        }
    }

    // Toggle Worker Status
    async function toggleWorkerStatus(workerId, isActive) {
        try {
            const res = await fetch(`http://localhost:5000/api/workers/${workerId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ isActive })
            });

            if (!res.ok) {
                alert("Failed to update worker status");
                return;
            }

            alert(`Worker ${isActive ? 'activated' : 'deactivated'} successfully`);
            loadWorkers();
        } catch (err) {
            console.error(err);
            alert("Failed to update worker status");
        }
    }

    // Delete Worker
    async function deleteWorker(workerId) {
        if (!confirm("Are you sure you want to delete this worker? All assigned tasks will be unassigned.")) {
            return;
        }

        try {
            const res = await fetch(`http://localhost:5000/api/workers/${workerId}`, {
                method: "DELETE"
            });

            if (!res.ok) {
                alert("Failed to delete worker");
                return;
            }

            alert("Worker deleted successfully");
            loadWorkers();
        } catch (err) {
            console.error(err);
            alert("Failed to delete worker");
        }
    }

    // Load workers on page load
    document.addEventListener("DOMContentLoaded", loadWorkers);
</script>

</body>
</html>

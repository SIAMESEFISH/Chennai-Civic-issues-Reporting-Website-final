<!DOCTYPE html>
<html>
<head>
    <title>Worker Dashboard - Chennai Civic System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .worker-dashboard {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #16a34a 0%, #059669 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.2);
        }

        body.dark .dashboard-header {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .dashboard-header h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
        }

        .worker-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        body.dark .stat-card {
            background: var(--card-dark);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
        }

        .stat-card h3 {
            font-size: 36px;
            margin: 0 0 10px 0;
            color: #16a34a;
        }

        body.dark .stat-card h3 {
            color: var(--neon-blue);
        }

        .stat-card p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        body.dark .stat-card p {
            color: #9ca3af;
        }

        .tasks-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        body.dark .tasks-section {
            background: var(--card-dark);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
        }

        .task-card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        body.dark .task-card {
            border-color: #374151;
        }

        .task-card:hover {
            border-color: #16a34a;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
        }

        body.dark .task-card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .task-info h3 {
            margin: 0 0 5px 0;
            color: #1f2937;
            font-size: 20px;
        }

        body.dark .task-info h3 {
            color: #e6e6e6;
        }

        .task-id {
            font-size: 13px;
            color: #6b7280;
        }

        .task-description {
            margin: 15px 0;
            color: #374151;
            line-height: 1.6;
        }

        body.dark .task-description {
            color: #d1d5db;
        }

        .task-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 15px 0;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
        }

        body.dark .task-meta {
            background: #1f2937;
        }

        .meta-item {
            font-size: 13px;
        }

        .meta-label {
            font-weight: 600;
            color: #6b7280;
            display: block;
            margin-bottom: 4px;
        }

        .meta-value {
            color: #1f2937;
        }

        body.dark .meta-value {
            color: #e6e6e6;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-start {
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-start:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-complete {
            background: #16a34a;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-complete:hover {
            background: #15803d;
            transform: translateY(-2px);
        }

        .btn-view {
            background: #6b7280;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-view:hover {
            background: #4b5563;
        }

        .notes-section {
            margin-top: 15px;
            padding: 15px;
            background: #fef3c7;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
        }

        body.dark .notes-section {
            background: #78350f;
            border-left-color: #fbbf24;
        }

        .notes-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            resize: vertical;
            min-height: 80px;
            margin-top: 8px;
        }

        body.dark .notes-section textarea {
            background: #1f2937;
            border-color: #374151;
            color: #e6e6e6;
        }

        .proof-upload {
            margin-top: 15px;
            padding: 15px;
            background: #ecfdf5;
            border-left: 4px solid #16a34a;
            border-radius: 8px;
        }

        body.dark .proof-upload {
            background: #064e3b;
            border-left-color: #34d399;
        }

        .proof-upload label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #065f46;
        }

        body.dark .proof-upload label {
            color: #a7f3d0;
        }

        .proof-upload input[type="file"] {
            margin-bottom: 10px;
            width: 100%;
        }

        .proof-upload small {
            color: #065f46;
            display: block;
        }

        body.dark .proof-upload small {
            color: #a7f3d0;
        }

        .proof-preview {
            margin-top: 10px;
            font-size: 13px;
            color: #065f46;
        }

        body.dark .proof-preview {
            color: #a7f3d0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 10px 20px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        body.dark .filter-tab {
            background: #1f2937;
            border-color: #374151;
            color: #d1d5db;
        }

        .filter-tab.active {
            background: #16a34a;
            color: white;
            border-color: #16a34a;
        }

        body.dark .filter-tab.active {
            background: var(--neon-blue);
            color: #000;
            border-color: var(--neon-blue);
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo">🌿 <strong>Chennai Civic-Issues Reporting System</strong></div>
    <nav>
        <a href="index.html">Home</a>
        <span id="workerWelcome" style="color: #16a34a; font-weight: 500; margin-left: 15px;"></span>
        <button onclick="handleWorkerLogout()" style="background: #dc2626; color: white; padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; margin-left: 10px;">
            Logout
        </button>
        <button id="themeToggle" class="theme-btn">🌙</button>
    </nav>
</header>

<div class="worker-dashboard">
    <div class="dashboard-header">
        <h1>👷 Worker Dashboard</h1>
        <p style="margin: 0;">Assigned Ward Number: <strong id="assignedWard">Loading...</strong></p>
    </div>

    <div class="worker-stats">
        <div class="stat-card">
            <h3 id="totalTasks">0</h3>
            <p>Total Assigned Tasks</p>
        </div>
        <div class="stat-card">
            <h3 id="pendingTasks">0</h3>
            <p>Pending Tasks</p>
        </div>
        <div class="stat-card">
            <h3 id="inProgressTasks">0</h3>
            <p>In Progress</p>
        </div>
        <div class="stat-card">
            <h3 id="completedTasks">0</h3>
            <p>Completed Tasks</p>
        </div>
    </div>

    <div class="tasks-section">
        <h2 style="margin-top: 0;">📋 My Tasks</h2>
        
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterTasks('all')">All Tasks</button>
            <button class="filter-tab" onclick="filterTasks('Pending')">Pending</button>
            <button class="filter-tab" onclick="filterTasks('In Progress')">In Progress</button>
            <button class="filter-tab" onclick="filterTasks('Resolved')">Completed</button>
        </div>

        <div id="tasksContainer">
            <!-- Tasks will be loaded here -->
        </div>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    let allTasks = [];
    let currentFilter = 'all';

    // Authentication Check
    (function checkWorkerAuth() {
        const isLoggedIn = localStorage.getItem("workerLoggedIn");
        const workerName = localStorage.getItem("workerName");
        const workerWard = localStorage.getItem("workerWardNumber") || localStorage.getItem("workerWard");

        if (isLoggedIn !== "true") {
            alert("Please login to access the worker dashboard");
            window.location.href = "worker-login.html";
            return;
        }

        const welcomeSpan = document.getElementById("workerWelcome");
        if (welcomeSpan && workerName) {
            welcomeSpan.textContent = `Welcome, ${workerName}!`;
        }

        const wardSpan = document.getElementById("assignedWard");
        if (wardSpan && workerWard) {
            wardSpan.textContent = workerWard;
        }
    })();

    function handleWorkerLogout() {
        if (confirm("Are you sure you want to logout?")) {
            localStorage.removeItem("workerLoggedIn");
            localStorage.removeItem("workerId");
            localStorage.removeItem("workerName");
            localStorage.removeItem("workerEmail");
            localStorage.removeItem("workerWard");
            localStorage.removeItem("workerWardNumber");
            localStorage.removeItem("workerSpecialization");
            window.location.href = "worker-login.html";
        }
    }

    async function loadTasks() {
        const workerId = localStorage.getItem("workerId");
        
        try {
            const res = await fetch(`http://localhost:5000/api/workers/${workerId}/tasks`);
            const tasks = await res.json();
            
            allTasks = tasks;
            updateStats(tasks);
            displayTasks(tasks);
        } catch (err) {
            console.error("Error loading tasks:", err);
            document.getElementById("tasksContainer").innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⚠️</div>
                    <p>Failed to load tasks. Please try again.</p>
                </div>
            `;
        }
    }

    function updateStats(tasks) {
        const total = tasks.length;
        const pending = tasks.filter(t => t.status === "Pending").length;
        const inProgress = tasks.filter(t => t.status === "In Progress").length;
        const completed = tasks.filter(t => t.status === "Resolved").length;

        document.getElementById("totalTasks").textContent = total;
        document.getElementById("pendingTasks").textContent = pending;
        document.getElementById("inProgressTasks").textContent = inProgress;
        document.getElementById("completedTasks").textContent = completed;
    }

    function filterTasks(status) {
        currentFilter = status;
        
        // Update active tab
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        event.target.classList.add('active');

        // Filter and display
        const filtered = status === 'all' 
            ? allTasks 
            : allTasks.filter(t => t.status === status);
        
        displayTasks(filtered);
    }

    function displayTasks(tasks) {
        const container = document.getElementById("tasksContainer");

        if (tasks.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <p>No tasks found</p>
                </div>
            `;
            return;
        }

        container.innerHTML = tasks.map(task => {
            const statusColor = task.status === "Resolved" ? "#16a34a" : 
                              task.status === "In Progress" ? "#3b82f6" : "#f59e0b";
            
            return `
                <div class="task-card" data-task-id="${task._id}">
                    <div class="task-header">
                        <div class="task-info">
                            <h3>${task.category}</h3>
                            <div class="task-id">ID: ${task.complaintId}</div>
                        </div>
                        <div style="display: inline-block; padding: 6px 14px; background: ${statusColor}; color: white; border-radius: 20px; font-size: 13px; font-weight: 600;">
                            ${task.status}
                        </div>
                    </div>

                    <div class="task-description">
                        ${task.description}
                    </div>

                    <div class="task-meta">
                        <div class="meta-item">
                            <span class="meta-label">📍 Ward Number</span>
                            <span class="meta-value">${task.wardNumber || 'Not specified'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">🏠 Address</span>
                            <span class="meta-value">${task.area}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">📊 Report Count</span>
                            <span class="meta-value">${task.reportCount || 1} reports</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">📅 Reported Date</span>
                            <span class="meta-value">${new Date(task.createdAt).toLocaleDateString()}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">⏱️ Assigned Date</span>
                            <span class="meta-value">${task.assignedTo?.assignedAt ? new Date(task.assignedTo.assignedAt).toLocaleDateString() : 'N/A'}</span>
                        </div>
                    </div>

                    ${task.image ? `
                        <div style="margin: 15px 0;">
                            <img src="http://localhost:5000/uploads/${task.image}" style="max-width: 100%; max-height: 300px; border-radius: 8px;" alt="Complaint Image">
                        </div>
                    ` : ''}

                    <div class="task-actions">
                        ${task.status === "Pending" ? `
                            <button class="btn-start" onclick="updateTaskStatus('${task.complaintId}', 'In Progress')">
                                🚀 Start Work
                            </button>
                        ` : ''}
                        
                        ${task.status === "In Progress" ? `
                            <div class="proof-upload">
                                <label for="resolvedImage-${task.complaintId}">Upload Resolved Problem Photo</label>
                                <input type="file" id="resolvedImage-${task.complaintId}" accept="image/*" onchange="previewResolvedPhoto('${task.complaintId}')">
                                <small>This proof image will be shared with admin and users for verification.</small>
                                <div class="proof-preview" id="proofPreview-${task.complaintId}"></div>
                            </div>
                            <button class="btn-complete" onclick="showNotesDialog('${task.complaintId}')">
                                ✅ Upload & Mark Complete
                            </button>
                        ` : ''}

                        ${task.latitude && task.longitude ? `
                            <button class="btn-view" onclick="viewLocation(${task.latitude}, ${task.longitude})">
                                🗺️ View Location
                            </button>
                        ` : ''}
                    </div>

                    ${task.status === "In Progress" || task.status === "Resolved" ? `
                        <div class="notes-section">
                            <strong>📝 Work Notes:</strong>
                            <div style="margin-top: 8px; color: #374151;">
                                ${task.workProgress?.workerNotes || 'No notes added yet'}
                            </div>
                        </div>
                    ` : ''}

                    ${task.workProgress?.resolvedImage ? `
                        <div style="margin-top: 12px;">
                            <strong style="font-size: 14px; color: #16a34a;">📷 Uploaded Resolved Proof</strong>
                            <div style="margin-top: 8px;">
                                <img src="http://localhost:5000/uploads/${task.workProgress.resolvedImage}" style="max-width: 100%; max-height: 220px; border-radius: 8px; border: 2px solid #bbf7d0;" alt="Resolved Proof Image">
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    async function updateTaskStatus(complaintId, status) {
        const workerId = localStorage.getItem("workerId");
        
        try {
            const res = await fetch(`http://localhost:5000/api/workers/tasks/${complaintId}/progress`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ workerId, status })
            });

            if (!res.ok) {
                const error = await res.json();
                alert(error.message || "Failed to update task");
                return;
            }

            const result = await res.json();
            alert(`✅ Task status updated to: ${status}\n\nThe admin dashboard has been updated automatically.`);
            loadTasks(); // Reload tasks
        } catch (err) {
            console.error(err);
            alert("Failed to update task status: " + err.message);
        }
    }

    function showNotesDialog(complaintId) {
        const notes = prompt("Add completion notes (optional):");
        if (notes !== null) {
            completeTask(complaintId, notes);
        }
    }

    function previewResolvedPhoto(complaintId) {
        const input = document.getElementById(`resolvedImage-${complaintId}`);
        const preview = document.getElementById(`proofPreview-${complaintId}`);

        if (!input || !preview) return;

        if (input.files && input.files[0]) {
            preview.textContent = `Selected: ${input.files[0].name}`;
        } else {
            preview.textContent = "";
        }
    }

    async function completeTask(complaintId, workerNotes) {
        const workerId = localStorage.getItem("workerId");
        const imageInput = document.getElementById(`resolvedImage-${complaintId}`);
        const resolvedFile = imageInput?.files?.[0];

        if (!resolvedFile) {
            alert("Please upload a resolved problem photo before marking this task as complete.");
            return;
        }

        const formData = new FormData();
        formData.append("workerId", workerId);
        formData.append("status", "Resolved");
        formData.append("workerNotes", workerNotes || "");
        formData.append("resolvedImage", resolvedFile);
        
        try {
            const res = await fetch(`http://localhost:5000/api/workers/tasks/${complaintId}/progress`, {
                method: "PUT",
                body: formData
            });

            if (!res.ok) {
                const error = await res.json();
                alert(error.message || "Failed to complete task");
                return;
            }

            const result = await res.json();
            alert("✅ Task completed successfully with proof photo!\n\nThe admin and users can now verify the resolved image.");
            loadTasks();
        } catch (err) {
            console.error(err);
            alert("Failed to complete task: " + err.message);
        }
    }

    function viewLocation(lat, lng) {
        window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
    }

    // Load tasks on page load
    document.addEventListener('DOMContentLoaded', loadTasks);
</script>

</body>
</html>
